<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="Eshika A">
    <meta name="description" content="Contact Information for the Little Taco Shop">
    <title>Contact Us - LTS</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1>Contact Us</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#about">About LTS</a></li>
                <li><a href="index.html#menu">Our Menu</a></li>
                <li><a href="hours.html">Store Hours</a></li>
            </ul>
        </nav>

        <figure>
            <img src="img/tacos close up.jpg" alt="Tacos Close Up" width="300" height="220" title="Tacos Close Up!">
            <figcaption>Little Taco Shop Tacos</figcaption>
        </figure>
    </header>
    <br>
    <main>
        <h2>
            Our Contact Form
        </h2>
        <section>
            <form action="https://httpbin.org/get" method="get">
                <fieldset>
                    <legend>Send Us A Message</legend>
                    <p>
                        <label for="name">Name:</label>
                        <input type="text" name="name" id="name" placeholder="your name" required>
                    </p>
                    <p>
                        <label for="email">Email:</label>
                        <input type="email" name="email" id="email" placeholder="your email" required>
                    </p>
                    <p>
                        <label for="message">Your Message:</label><br>
                        <textarea name="message" id="message" placeholder="Type your message here" rows="10"
                            cols="30"></textarea>
                    </p>
                </fieldset>
                <button type="submit">Send</button>
                <button type="reset">Reset</button>
            </form>
        </section>
        <br>
        <section>
            <h2>Our Location</h2>
            <address>
                555 Taco Temptation Lane, Suite T<br>Kansas City, MO 55555-5555
                <br>
                <br>
                Phone: <a href="tel:+555-555-5555">555-555-5555</a>
            </address>
        </section>
        <br>
        <a href="#">Back to Top</a>
    </main>
    <footer>
        <hr>
        <p>Copyright &copy; The Little Taco Shop</p>
    </footer>
</body>

</html>
